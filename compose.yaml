services:
  emage:
    image: emage
    build:
      context: .
      dockerfile: Emage/Dockerfile
      additional_contexts:
        wasm-source: ../../CLionProjects/EmageWasm
    ports:
      - "3233:3233"
    environment:
      Emage__UploadPassword: ${EMAGE_UPLOAD_PASSWORD:-}
    volumes:
      - emage-images:/data/images
    restart: unless-stopped

volumes:
  emage-images:
